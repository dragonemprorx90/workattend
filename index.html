html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.app{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;min-height:56px}
.bar h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.bar .title-wrap{flex:1;min-width:0}

.icon-btn:hover{background:var(--surface-2)}

.scroll>*{flex-shrink:0}
.bar,.nav{flex-shrink:0}
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.nav button.on{color:var(--navy)} .nav button.on svg{stroke-width:2.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.hero{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-deep) 100%);color:var(--on-navy);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .big{font-size:22px;font-weight:800;line-height:1.2}
.hero .meta{font-size:13px;opacity:.85}
h2{font-size:16px;font-weight:800;margin:0}
.muted{color:var(--ink-2);font-size:13.5px} .tiny{color:var(--ink-3);font-size:12.5px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:700;font-size:13.5px}

.btn:active{transform:scale(.985)}
.btn.primary{background:var(--navy);color:var(--on-navy)} .btn.tonal{background:var(--navy-soft);color:var(--navy)}

.btn.wa{background:#1FA855;color:#fff}

.row{display:flex;gap:8px;align-items:center} .row>.btn{flex:1}
.fab{position:absolute;inset-inline-end:16px;bottom:84px;width:56px;height:56px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(29,63,115,.35);font-size:30px;line-height:1;z-index:5}

.item:last-child{border-bottom:0} button.item:hover{background:var(--surface-2)}

.avatar{width:40px;height:40px;border-radius:13px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.hero .chip{background:rgba(255,255,255,.14);color:#fff}
.chip b{font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.c-present{background:var(--s-present)} .c-late{background:var(--s-late)} .c-absent{background:var(--s-absent)} .c-sick{background:var(--s-sick)} .c-leave{background:var(--s-leave)} .c-annual{background:var(--s-annual)} .c-none{background:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px;font-size:15px}
textarea.input{min-height:110px;resize:vertical;line-height:1.55}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}

.att{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}

.st5{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}

.st5 button.on{color:#fff}

.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--good)} .switch.on::after{transform:translateX(18px)} [dir="rtl"] .switch.on::after{transform:translateX(-18px)}

.sheet{background:var(--surface);width:100%;max-height:92%;border-radius:22px 22px 0 0;padding:12px 16px 18px;display:flex;flex-direction:column;gap:10px;animation:up .18s ease-out;overflow-y:auto}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px;flex:none}
.sheet h3{margin:0;font-size:17px;font-weight:800}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;z-index:40;text-align:center;animation:up .15s ease-out}

.wa-prev{background:#0b141a;border-radius:14px;padding:12px;border:1px solid #1f2c34}
.wa-prev .bubble{background:#005c4b;color:#e9edef;border-radius:10px;padding:9px 11px;font-size:14px;white-space:pre-wrap;line-height:1.5;unicode-bidi:plaintext;text-align:start}
.grid5{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--surface-2);border-radius:12px;padding:9px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-3);font-weight:800}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep th,table.rep td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
table.rep th:first-child,table.rep td:first-child{text-align:start;font-weight:700;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rep tr.click{cursor:pointer} table.rep tr.click:hover{background:var(--surface-2)}
.imp-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.imp-row input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--navy)}
.imp-row .body{flex:1;min-width:0}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--warn-soft);color:var(--warn)}
.datebar{display:flex;align-items:center;gap:6px}
.empty{text-align:center;padding:28px 12px;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:center}
.sync-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ink-3)}
.sync-dot.ok{background:var(--good)} .sync-dot.err{background:var(--bad)} .sync-dot.busy{background:var(--warn)}
.ltr{direction:ltr;unicode-bidi:plaintext}
.hidden{display:none!important}
</style>

function summaryText(date, l) {

  const lines = [l === "ar" ? `📋 ملخص الحضور — ${fmtDate(date, "ar")}` : `📋 Attendance — ${fmtDate(date, "en")}`];
  for (const s of STATUSES) {
    if (s !== "present" && !c[s]) continue;

/* ================= sync with Google Apps Script ================= */
class ApiError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }
const TABLES = ["employees", "attendance", "messages"];
const Sync = {
  timer: null,
  enabled() { return !!(S.server && S.pin); },
  async api(body, server = S.server, pin = S.pin) {
    let res;
    try {
      res = await fetch(server, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({}, body, { pin })), redirect: "follow" });
    } catch (e) { throw new ApiError("OFFLINE"); }
    let j; try { j = await res.json(); } catch (e) { throw new ApiError("BAD_SERVER", "HTTP " + res.status); }
    if (j && j.error) throw new ApiError(j.error, j.message);
    return j;
  },
  soon() { clearTimeout(this.timer); if (this.enabled()) this.timer = setTimeout(() => this.run(), 1500); },
  async run(manual) {
    if (!this.enabled() || UI.syncing) return false;
    UI.syncing = true; paintSync();
    try {
      let since = META.since, first = true;
      const pending = {}; TABLES.forEach(tb => pending[tb] = Object.keys(DIRTY[tb]));
      while (first || TABLES.some(tb => pending[tb].length)) {
        first = false;
        const push = {}, sent = {}; let budget = 400;
        for (const tb of TABLES) {
          const ids = pending[tb].splice(0, budget); budget -= ids.length;
          push[tb] = ids.map(id => D[tb][id]).filter(Boolean); sent[tb] = ids.map(id => [id, DIRTY[tb][id]]);
        }
        const r = await this.api({ action: "sync", since, push });
        for (const tb of TABLES) {
          for (const [id, at] of sent[tb]) if (DIRTY[tb][id] === at) delete DIRTY[tb][id];
          for (const row of r[tb] || []) {
            const loc = D[tb][row.id];
            if (!loc || Number(row.updatedAt) >= Number(loc.updatedAt || 0)) {
              if (tb === "attendance" && loc && loc.empName) row.empName = loc.empName;
              D[tb][row.id] = row;
              if (DIRTY[tb][row.id] && DIRTY[tb][row.id] <= Number(row.updatedAt)) delete DIRTY[tb][row.id];
            }
          }
        }
        since = r.now;
      }
      META.since = since; META.lastSync = Date.now(); META.err = "";
      saveAll(); UI.syncing = false; render(); if (manual) toast(t("synced"));
      return true;
    } catch (e) {
      META.err = e.code || "ERR"; saveAll(); UI.syncing = false; paintSync();
      if (manual || e.code === "BAD_PIN") toast(errText(e));
      return false;
    }
  },
};
function errText(e) { return e.code === "BAD_PIN" ? t("badPin") : e.code === "OFFLINE" ? t("offline") : `${t("syncErrS")}: ${e.message || e.code}`; }
function paintSync() { const d = $("#syncDot"); if (d) d.className = "sync-dot " + syncClass(); }
function syncClass() { if (!Sync.enabled()) return ""; if (UI.syncing) return "busy"; return META.err ? "err" : "ok"; }

const KEYS = {
  name: ["name", "full name", "fullname", "employee", "employee name", "staff", "staff name", "الاسم", "اسم", "اسم الموظف", "الموظف", "الاسم الكامل"],
  phone: ["phone", "mobile", "mobile number", "phone number", "tel", "telephone", "cell", "whatsapp", "number", "الهاتف", "رقم الهاتف", "الجوال", "رقم الجوال", "الموبايل", "رقم", "واتساب", "هاتف", "جوال"],
  title: ["title", "job", "job title", "position", "role", "designation", "المسمى", "المسمى الوظيفي", "الوظيفة", "المهنة"],
  dept: ["department", "dept", "section", "team", "division", "القسم", "الإدارة", "الادارة", "الفريق"],
  first: ["first name", "firstname", "given name", "الاسم الأول"], last: ["last name", "lastname", "surname", "family name", "family", "اسم العائلة", "العائلة"],

function headerMap(row) {
  const m = {}; let hits = 0;
  row.forEach((cell, i) => {
    const c = normName(cell);
    for (const k of Object.keys(KEYS)) if (m[k] == null && KEYS[k].some(x => normName(x) === c)) { m[k] = i; hits++; break; }
  });
  return hits ? m : null;
}
function looksPhone(v) { const raw = String(v).replace(/[\s\-+().]/g, ""); const d = digits(v); return d.length >= 7 && d.length <= 15 && d.length >= raw.length * 0.8; }
function tableToPeople(rows) {
  rows = rows.map(r => (Array.isArray(r) ? r : [r]).map(c => c == null ? "" : String(c).trim())).filter(r => r.some(c => c));
  if (!rows.length) return [];
  let map = headerMap(rows[0]);
  if (map) rows = rows.slice(1);
  else {
    map = {}; const cols = Math.max(...rows.map(r => r.length));
    for (let i = 0; i < cols; i++) {
      const vals = rows.map(r => r[i] || "").filter(Boolean);
      if (!vals.length) continue;
      if (vals.filter(looksPhone).length / vals.length > .6) { if (map.phone == null) map.phone = i; }
      else if (map.name == null && vals.filter(v => /\p{L}/u.test(v)).length / vals.length > .6) map.name = i;
    }
  }
  const out = [];
  for (const r of rows) {
    let name = map.name != null ? r[map.name] : "";
    if (!name && (map.first != null || map.last != null)) name = [r[map.first], r[map.last]].filter(Boolean).join(" ");
    name = String(name || "").replace(/\s+/g, " ").trim();
    if (!name || !/\p{L}/u.test(name)) continue;
    out.push({ name, phone: map.phone != null ? r[map.phone] || "" : "", title: map.title != null ? r[map.title] || "" : "", dept: map.dept != null ? r[map.dept] || "" : "" });
  }
  return out;
}
function parseDelimited(text) {
  text = String(text || "").replace(/^﻿/, "");
  const first = text.split(/\r?\n/).find(l => l.trim()) || "";
  const best = ["\t", ";", ",", "|"].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0];
  const d = best[1] > 1 ? best[0] : null;
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === "") { q = true; continue; }
    if (d && ch === d) { row.push(cell); cell = ""; continue; }
    if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; continue; }

function decodeVcf(v, key) {

function parseVcf(text) {

    for (const line of card.split(/\r?\n/)) {

      const key = line.slice(0, i).toUpperCase(), val = decodeVcf(line.slice(i + 1), key), base = key.split(";")[0].replace(/^ITEM\d+\./, "");

      else if (base === "N") n = val.split(";").slice(0, 2).reverse().filter(Boolean).join(" ");

      else if (base === "ORG") org = val.split(";")[0];
      else if (base === "TITLE") title = val;

    const name = (fn || n).trim();

  return out;
}
function parseJson(text) {

  if (j && j.data && j.data.employees) j = Object.values(j.data.employees).filter(e => !e.deletedAt);
  if (!Array.isArray(j)) j = Object.values(j || {});
  return j.map(x => typeof x === "string" ? { name: x } : { name: x.name || x.Name || x["الاسم"] || x.fullName || "", phone: x.phone || x.mobile || x.Phone || "", title: x.title || x.job || "", dept: x.dept || x.department || "" }).filter(x => String(x.name).trim());
}
function loadScript(src) { return new Promise((ok, no) => { if (window.XLSX) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function readImportFile(file) {
  const name = file.name.toLowerCase();
  if (/\.(xlsx|xls|xlsm|ods)$/.test(name)) {
    await loadScript("xlsx.full.min.js");
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: "array" });
    for (const sn of wb.SheetNames) { const people = tableToPeople(XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: "" })); if (people.length) return people; }

  const rows = Object.values(D.attendance).filter(a => !a.deletedAt && a.status && a.date && a.date.startsWith(m)).sort((a, b) => a.date.localeCompare(b.date) || name(a.empId).localeCompare(name(b.empId), "ar"));

  for (const r of rows) { const e = D.employees[r.empId] || {}; lines.push([r.date, name(r.empId), e.dept || "", `${ST[r.status].ar} / ${ST[r.status].en}`].map(csvCell).join(",")); }
  lines.push("", ["Employee / الموظف", ...STATUSES.map(s => `${ST[s].ar} / ${ST[s].en}`)].map(csvCell).join(","));
  for (const id of [...new Set(rows.map(r => r.empId))]) lines.push([name(id), ...STATUSES.map(s => rows.filter(r => r.empId === id && r.status === s).length)].map(csvCell).join(","));
  saveFile(`attendance-${m}.csv`, "text/csv", "﻿" + lines.join("\r\n"));
}

function waNumber() { let n = digits(S.waNumber); if (!n) return ""; if (n.startsWith("00")) n = n.slice(2); else if (n.startsWith("0")) n = (digits(S.cc) || "971") + n.slice(1); return n; }
function openWhatsApp(text) {
  const num = S.dest === "number" ? waNumber() : "";
  if (window.AndroidBridge && AndroidBridge.openWhatsApp) { AndroidBridge.openWhatsApp(text, num); return; }
  window.location.href = `https://wa.me/${num}?text=${encodeURIComponent(text)}`;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (x) {} ta.remove(); }
  toast(t("copied"));
}

  }
  if (o.kind === "import") {
    return `<div class="overlay" data-act="closeOv"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>
      <h3>${t("impTitle")}</h3><div class="muted">${t("impHint")}</div>
      <div class="chips"><span class="chip">Excel .xlsx .xls</span><span class="chip">CSV</span><span class="chip">vCard .vcf</span><span class="chip">TXT</span><span class="chip">JSON</span></div>
      <button class="btn primary" data-act="pickFile">${I.upload}${t("chooseFile")}</button>
      <div class="field"><label for="pasteIn">${t("pasteList")}</label><textarea class="input" id="pasteIn" dir="auto" placeholder="${t("pasteHint")}"></textarea></div>
      <button class="btn tonal" data-act="readPaste">${t("readList")}</button>
    </div></div>`;
  }
  if (o.kind === "impPreview") {
    const n = o.rows.filter(r => r.on).length;
    return `<div class="overlay"><div class="sheet full" role="dialog" aria-modal="true">
      <div class="row"><h3 style="flex:1">${t("found", o.rows.length)}</h3><button class="icon-btn" data-act="closeOv" aria-label="${t("cancel")}">${I.close}</button></div>
      <div class="row"><button class="btn sm ghost" data-act="impAll" data-v="1">${t("selAll")}</button><button class="btn sm ghost" data-act="impAll" data-v="0">${t("selNone")}</button></div>
      <div style="flex:1;overflow-y:auto">${o.rows.map((r, i) => `<label class="imp-row"><input type="checkbox" data-imp="${i}" ${r.on ? "checked" : ""}>
        <span class="body"><b>${esc(r.name)}</b> ${r.dup ? `<span class="tag">${t("exists")}</span>` : ""}<div class="tiny">${esc([r.phone, r.title, r.dept].filter(Boolean).join(" · "))}</div></span></label>`).join("")}</div>
      <button class="btn primary" data-act="doImport" ${n ? "" : "disabled"}>${t("importN", n)}</button>
    </div></div>`;
  }
  if (o.kind === "confirm") {
    return `<div class="overlay" data-act="closeOv"><div class="sheet" role="alertdialog" aria-modal="true"><div class="grab"></div>
      <h3>${esc(o.text)}</h3><div class="row"><button class="btn ghost" data-act="closeOv">${esc(o.no || t("cancel"))}</button><button class="btn ${o.danger ? "danger" : "primary"}" data-act="confirmYes">${esc(o.yes)}</button></div></div></div>`;
  }
  if (o.kind === "pasteSetup") {
    return `<div class="overlay" data-act="closeOv"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>
      <h3>${t("pasteSetup")}</h3><textarea class="input ltr" id="codeIn" placeholder="${t("setupCode")}"></textarea>
      <div class="row"><button class="btn ghost" data-act="closeOv">${t("cancel")}</button><button class="btn primary" data-act="applyCode2">${t("connect")}</button></div></div></div>`;
  }
  return "";
}

/* ================= interactions ================= */
function toast(msg) { UI.toast = msg; render(); clearTimeout(toast.tm); toast.tm = setTimeout(() => { UI.toast = null; render(); }, 2600); }
function confirmBox(text, yes, fn, danger, no) { UI.overlay = { kind: "confirm", text, yes, fn, danger, no }; render(); }
function keepFocus(id, fn) { const el = document.getElementById(id); const pos = el ? el.selectionStart : null; fn(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }
function refreshPreview() { const b = $(".wa-prev .bubble"); if (b) b.textContent = hybridText(); }

function bindAfter() {
  const q = $("#qIn"); if (q) q.oninput = () => keepFocus("qIn", () => { UI.q = q.value; render(); });
  const pq = $("#pqIn"); if (pq) pq.oninput = () => keepFocus("pqIn", () => { UI.pq = pq.value; render(); });
  const di = $("#dateIn"); if (di) di.onchange = () => { if (di.value) { UI.date = di.value; render(); } };
  const src = $("#srcIn"); if (src) src.oninput = () => { UI.msg.src = src.value; };
  const ar = $("#arIn"); if (ar) ar.oninput = () => { UI.msg.ar = ar.value; refreshPreview(); };
  const en = $("#enIn"); if (en) en.oninput = () => { UI.msg.en = en.value; refreshPreview(); };
  const num = $("#numIn"); if (num) num.onchange = () => { S.waNumber = num.value.trim(); saveAll(); };
  const cc = $("#ccIn"); if (cc) cc.onchange = () => { S.cc = digits(cc.value) || "971"; saveAll(); };
  document.querySelectorAll("[data-imp]").forEach(cb => cb.onchange = () => {
    UI.overlay.rows[+cb.dataset.imp].on = cb.checked;
    const b = $('[data-act="doImport"]'), n = UI.overlay.rows.filter(r => r.on).length;
    if (b) { b.textContent = t("importN", n); b.disabled = !n; }
  });
}
function resetMsg() { UI.msg = { src: "", ar: "", en: "", summary: S.defSummary, busy: false, note: "" }; }

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (act === "closeOv") { if (el.classList.contains("overlay") && ev.target !== el) return; UI.overlay = null; return render(); }
  switch (act) {
    case "tab": UI.tab = v; UI.overlay = null; render(); { const sc = $(".scroll"); if (sc) sc.scrollTop = 0; } break;
    case "day": UI.date = addDays(UI.date, +v); render(); break;
    case "goToday": UI.date = ymd(new Date()); render(); break;
    case "openDay": UI.date = v; UI.tab = "today"; render(); break;
    case "month": { const [y, m] = UI.month.split("-").map(Number); UI.month = ymd(new Date(y, m - 1 + (+v), 1)).slice(0, 7); render(); break; }
    case "mark": { const e = D.employees[id]; if (!e) return; setAtt(UI.date, e, attOf(UI.date, id) === v ? null : v); render(); break; }
    case "restPresent": for (const e of employees()) if (!attOf(UI.date, e.id)) setAtt(UI.date, e, "present"); render(); break;
    case "toMsgSummary": UI.msg.summary = true; UI.tab = "msg"; render(); break;
    case "addEmp": UI.overlay = { kind: "empEdit" }; render(); setTimeout(() => { const f = $("#fName"); if (f) f.focus(); }, 50); break;
    case "editEmp": UI.overlay = { kind: "empEdit", emp: D.employees[id] }; render(); break;
    case "empDetail": UI.overlay = { kind: "empDetail", id }; render(); break;
    case "saveEmp": {
      const name = $("#fName").value.replace(/\s+/g, " ").trim(); if (!name) { toast(t("nameReq")); return; }
      const row = Object.assign({}, UI.overlay.emp || { id: uid("e"), createdAt: Date.now() }, { name, phone: $("#fPhone").value.trim(), title: $("#fTitle").value.trim(), dept: $("#fDept").value.trim(), notes: $("#fNotes").value.trim(), deletedAt: null });
      put("employees", row); UI.overlay = null; toast(t("saved")); break; }
    case "delEmp": { const e = D.employees[id]; confirmBox(t("confirmDel", e.name), t("del"), () => { put("employees", Object.assign({}, e, { deletedAt: Date.now() })); toast(t("deleted")); }, true); break; }
    case "openImport": UI.overlay = { kind: "import" }; render(); break;
    case "pickFile": $("#fileImport").value = ""; $("#fileImport").click(); break;
    case "readPaste": openImportPreview(tableToPeople(parseDelimited($("#pasteIn").value))); break;
    case "impAll": UI.overlay.rows.forEach(r => r.on = v === "1"); render(); break;
    case "doImport": {
      const rows = UI.overlay.rows.filter(r => r.on), now = Date.now();
      rows.forEach((r, i) => { const row = { id: uid("e"), name: r.name, phone: r.phone || "", title: r.title || "", dept: r.dept || "", notes: "", createdAt: now + i, deletedAt: null, updatedAt: now + i }; D.employees[row.id] = row; DIRTY.employees[row.id] = row.updatedAt; });
      saveAll(); Sync.soon(); UI.overlay = null; UI.tab = "people"; toast(t("imported", rows.length)); break; }
    case "translate": {
      const src = ($("#srcIn") || {}).value || UI.msg.src; UI.msg.src = src; UI.msg.note = "";
      if (!src.trim()) { toast(t("emptyMsg")); return; }
      const ar = isArabicText(src);
      const fallback = note => { if (ar) UI.msg.ar = src; else UI.msg.en = src; UI.msg.note = note; };
      if (!Sync.enabled()) { fallback(t("needServer")); return render(); }
      UI.msg.busy = true; render();
      try { const r = await Sync.api({ action: "translate", text: src }); UI.msg.ar = r.ar; UI.msg.en = r.en; }
      catch (e) { fallback(e.code === "OFFLINE" ? t("offline") : t("trErr")); }
      UI.msg.busy = false; render(); break; }
    case "toggleSummary": UI.msg.summary = !UI.msg.summary; render(); break;
    case "sendWa": case "copyMsg": {
      if (!UI.msg.ar && !UI.msg.en && UI.msg.src.trim()) { if (isArabicText(UI.msg.src)) UI.msg.ar = UI.msg.src; else UI.msg.en = UI.msg.src; }
      const txt = hybridText(); if (!txt) { toast(t("emptyMsg")); return; }
      if (act === "copyMsg") return copyText(txt);
      /* Log first: on the web, opening wa.me leaves the page, so nothing after this line is guaranteed to run. */
      put("messages", { id: uid("m"), date: UI.date, text: txt, createdAt: Date.now(), deletedAt: null });
      resetMsg(); render();
      try { if (Sync.enabled()) await Promise.race([Sync.run(), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
      openWhatsApp(txt);
      break; }
    case "reuseMsg": { const m = D.messages[id]; if (m) copyText(m.text); break; }
    case "exportCsv": exportMonthCsv(); break;
    case "syncNow": if (Sync.enabled()) { toast(t("syncing")); await Sync.run(true); } break;
    case "connect": { UI.form = { url: $("#sUrl").value, pin: $("#sPin").value }; if (await connect(UI.form.url, UI.form.pin)) { UI.form = null; render(); } break; }
    case "useLocal": S.setupDone = true; saveAll(); render(); break;
    case "applyCode": case "applyCode2": {
      const c = readSetupCode(($(act === "applyCode" ? "#sCode" : "#codeIn") || {}).value || ""); if (!c) { toast(t("badCode")); return; }
      UI.overlay = null; if (await connect(c.server, c.pin)) { toast(t("setupApplied")); } break; }
    case "pasteSetupSheet": UI.overlay = { kind: "pasteSetup" }; render(); break;
    case "shareSetup": {
      const code = setupCode(), link = appUrl() + "#setup=" + code, text = t("setupShareText", link, code);
      if (window.AndroidBridge && AndroidBridge.shareText) AndroidBridge.shareText(text);
      else if (navigator.share) { try { await navigator.share({ text }); } catch (e) {} } else copyText(text);
      break; }
    case "disconnect": confirmBox(t("disconnect") + "?", t("disconnect"), () => { S.server = ""; S.pin = ""; S.noAuto = true; META.since = 0; META.err = ""; saveAll(); render(); }, true); break;
    case "dest": S.dest = v; saveAll(); render(); break;
    case "defSummary": S.defSummary = !S.defSummary; UI.msg.summary = S.defSummary; saveAll(); render(); break;
    case "lang": S.lang = v; saveAll(); render(); break;
    case "backup": saveFile(`workattend-backup-${ymd(new Date())}.json`, "application/json", JSON.stringify({ app: "workattend", version: 1, exportedAt: Date.now(), data: D }, null, 1)); break;
    case "restore": $("#fileRestore").value = ""; $("#fileRestore").click(); break;
    case "erase": confirmBox(t("eraseConfirm"), t("erase"), () => { ["wa.data", "wa.dirty", "wa.meta"].forEach(k => localStorage.removeItem(k)); location.reload(); }, true); break;
    case "confirmYes": { const fn = UI.overlay.fn; UI.overlay = null; render(); if (fn) fn(); break; }
  }
});

async function handleImportFile(f) { try { openImportPreview(await readImportFile(f)); } catch (err) { console.error(err); UI.overlay = null; toast(t("fileErr")); } }
async function handleRestoreFile(f) {
  try {
    const j = JSON.parse(await f.text()), data = j.data || j;
    confirmBox(t("restoreConfirm"), t("restoreBackup"), () => {
      for (const tb of TABLES) for (const row of Object.values(data[tb] || {})) {
        const loc = D[tb][row.id]; if (row && row.id && (!loc || (row.updatedAt || 0) > (loc.updatedAt || 0))) { D[tb][row.id] = row; DIRTY[tb][row.id] = row.updatedAt || Date.now(); }
      }
      saveAll(); Sync.soon(); toast(t("restored"));
    });
  } catch (err) { toast(t("fileErr")); }
}
$("#fileImport").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) handleImportFile(f); });
/* Android app hooks: a file opened/shared with the app, and the system Back button */
window.onNativeFile = (name, base64) => { try { const bin = Uint8Array.from(atob(base64), c => c.charCodeAt(0)); UI.tab = "people"; handleImportFile(new File([bin], name)); } catch (e) { toast(t("fileErr")); } };
window.onNativeSaved = ok => toast(ok ? t("exported") : t("fileErr"));
window.onAndroidBack = () => { if (UI.overlay) { UI.overlay = null; render(); return true; } if (S.setupDone && UI.tab !== "today") { UI.tab = "today"; render(); return true; } return false; };
$("#fileRestore").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) handleRestoreFile(f); });

/* ================= boot ================= */
(async function boot() {
  const hash = location.hash || "";
  if (hash.startsWith("#setup=")) {
    const c = readSetupCode(hash); history.replaceState(null, "", location.pathname + location.search);
    render();
    if (c && await connect(c.server, c.pin)) toast(t("setupApplied"));
  }
  render();
  if (Sync.enabled()) Sync.run();
  setInterval(() => { if (document.visibilityState === "visible") Sync.run(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Sync.run(); });
  window.addEventListener("online", () => Sync.run());
})();
</script>
